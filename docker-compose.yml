# =============================================================================
# Docker Compose - UnixDriver
# Servicios: Base de Datos PostgreSQL 16 (Local), Backend FastAPI y Frontend Web
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # 1. Base de datos relacional local (Opcional si no se usa AWS RDS)
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: unixdriver-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_DB: ${POSTGRES_DB:-unixdriver}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-unixdriver}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - unixdriver-network

  # ---------------------------------------------------------------------------
  # 2. API Backend (FastAPI + Uvicorn + Integración AWS S3 / RDS)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: unixdriver-backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres123}@db:5432/${POSTGRES_DB:-unixdriver}}
      - USE_RDS_IAM=${USE_RDS_IAM:-false}
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend:/app/backend
    networks:
      - unixdriver-network

  # ---------------------------------------------------------------------------
  # 3. Frontend Web (Nginx)
  # ---------------------------------------------------------------------------
  frontend:
    image: nginx:alpine
    container_name: unixdriver-frontend
    restart: always
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    networks:
      - unixdriver-network

volumes:
  postgres_data:
    driver: local

networks:
  unixdriver-network:
    driver: bridge
